name: registry

# Single entry point for the registry:
#   - schedule  -> check upstream for new agent versions, open a PR
#   - push / PR -> validate declarations, then build + smoke-test every agent
#
# Publishing is the default. The only case where images are not pushed is a
# pull request, because fork PRs run with a read-only GITHUB_TOKEN and a PR
# must never overwrite a published tag.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated agent ids (empty = every agent)"
        type: string
        default: ""
      push:
        description: "Push images to GHCR"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- upstream
  sync:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply upstream updates
        id: sync
        run: |
          node tools/sync-upstream.mjs --write | tee /tmp/sync.log
          node tools/build-index.mjs
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate updated declarations
        if: steps.sync.outputs.changed == 'true'
        run: node tools/validate.mjs

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-upstream
          title: "chore: sync ACP agent versions from upstream"
          commit-message: "chore: sync ACP agent versions from upstream"
          body-path: /tmp/sync.log
          delete-branch: true

  # ------------------------------------------------------------------ images
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/validate.mjs
      - run: node tools/build-index.mjs --check

  matrix:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.pick.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          list=$(node -e '
            const ids = require("./dist/index.json").agents.map((a) => a.id);
            const only = (process.env.ONLY ?? "")
              .split(",").map((s) => s.trim()).filter(Boolean);
            const picked = only.length ? ids.filter((id) => only.includes(id)) : ids;
            if (!picked.length) throw new Error("no agents matched --only filter");
            process.stdout.write(JSON.stringify(picked));
          ')
          echo "agents=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agent: ${{ fromJSON(needs.matrix.outputs.agents) }}
    env:
      # Pull requests validate only; every other trigger publishes.
      PUSH: ${{ github.event_name != 'pull_request' && inputs.push != false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test ${{ matrix.agent }}
        run: |
          node tools/build.mjs --only "${{ matrix.agent }}" \
            ${{ env.PUSH == 'true' && '' || '--no-push' }}