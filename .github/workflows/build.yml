name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which agents to build"
        type: choice
        options: [enabled, all]
        default: enabled
      push:
        description: "Push images to GHCR"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/validate.mjs
      - run: node tools/build-index.mjs --check

  matrix:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.pick.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          if [ "${{ inputs.scope }}" = "all" ]; then
            list=$(node -p "JSON.stringify(require('./dist/index.json').agents.map(a=>a.id))")
          else
            list=$(node -p "JSON.stringify(require('./dist/index.json').agents.filter(a=>a.enabled).map(a=>a.id))")
          fi
          echo "agents=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agent: ${{ fromJSON(needs.matrix.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test ${{ matrix.agent }}
        run: |
          node tools/build.mjs --only "${{ matrix.agent }}" \
            ${{ inputs.push && '--push' || '' }}